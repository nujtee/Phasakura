name: diag cron (temporary, read-only)
on:
  push:
    branches: [diag/cron-tail]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: smoke (read-only)
        run: |
          { npx tsx scripts/smoke-test.ts https://lungtaihomestay.com 2>&1; } > out.txt || true
      - name: annotate
        if: always()
        run: |
          m=$(grep -v '^\s*$' out.txt | cut -c1-300 | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=out::$m"

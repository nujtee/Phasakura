name: diag cron (temporary, read-only)
on:
  push:
    branches: [diag/cron-tail]
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: schedules and deployments
        run: |
          {
          for w in $(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq -r '.result[].id'); do
            echo "== $w schedules"
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$w/schedules" | jq -c '[.result.schedules[]? | .cron + " @" + .created_on[0:16]]'
          done
          echo "== subscriptions"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/account-settings" | jq -c '.result // .errors'
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions" | jq -c '[.result[]? | {rate_plan: .rate_plan.id, product: .product.name, state}] , .errors'
          } > out1.txt 2>&1; cat out1.txt
      - name: tail scheduled events (only cron events, 150 s)
        run: |
          for w in cherngdoi suanpho; do
            (timeout 130 npx -y wrangler@4 tail $w --format json > $w.json 2>$w.err || true) &
          done
          wait
          {
          for w in cherngdoi suanpho; do
            echo "== $w: $(wc -l < $w.json) lines"
            tail -5 $w.err
            jq -c 'select(.event.cron != null) | {cron: .event.cron, scheduledTime: .event.scheduledTime, outcome, cpu: .cpuTime, wall: .wallTime, exceptions: [.exceptions[]? | (.name + ": " + (.message[0:200]))], logs: [.logs[]? | (.level + " " + ((.message|tostring)[0:200]))][0:15]}' $w.json || true
            jq -r 'select(.event.request != null) | .outcome' $w.json | sort | uniq -c
          done
          } > out2.txt 2>&1; cat out2.txt
      - name: annotate
        if: always()
        run: |
          for f in out1.txt out2.txt; do
            m=$(grep -v '^\s*$' $f | cut -c1-700 | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::notice title=$f::$m"
          done

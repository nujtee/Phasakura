name: diag cron (temporary, read-only)
on:
  push:
    branches: [diag/cron-tail]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: webhook reachability (unsigned POST must be refused 401)
        run: |
          {
          for u in https://phatopview.com/api/line/webhook https://www.phatopview.com/api/line/webhook; do
            echo "== $u"
            curl -s -o body.txt -w "status=%{http_code} redirect=%{redirect_url}\n" -X POST -H "Content-Type: application/json" -d '{"destination":"x","events":[]}' "$u"
            head -c 200 body.txt; echo
          done
          } > out.txt 2>&1 || true
      - name: annotate
        if: always()
        run: |
          m=$(grep -v '^\s*$' out.txt | cut -c1-300 | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=out::$m"

name: diag cron (temporary, read-only)
on:
  push:
    branches: [diag/cron-tail]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: DNS of Zoho through Cloudflare's resolver
        run: |
          for h in accounts.zoho.com mail.zoho.com; do
            for t in A CNAME; do
              echo "$h $t: $(curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$h&type=$t" | jq -c '{Status, Answer: [.Answer[]? | .data]}')" >> out.txt
            done
            echo "$h google: $(curl -s "https://dns.google/resolve?name=$h&type=A" | jq -c '{Status, Answer: [.Answer[]? | .data]}')" >> out.txt
          done
      - name: annotate
        if: always()
        run: |
          m=$(cat out.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=out::$m"

name: diag cron (temporary, read-only)
on:
  push:
    branches: [diag/cron-tail]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: secret NAMES only (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          { for w in lungtaihomestay cherngdoi phasakura; do echo "== $w"; npx wrangler secret list --name "$w" 2>&1 | grep -o '"name": *"[A-Z0-9_]*"' | sed 's/"name": *//'; done; } > out.txt || true
      - name: annotate
        if: always()
        run: |
          m=$(grep -v '^\s*$' out.txt | cut -c1-300 | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=out::$m"

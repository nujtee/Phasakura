name: diag cron (temporary, read-only)
on:
  push:
    branches: [diag/cron-tail]
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: preflight + smoke (read-only)
        run: |
          { npx tsx scripts/preflight.ts --config sites/pk-putaberg/wrangler.jsonc 2>&1 | grep -E "✗|error|warn|×" ; echo "--- smoke"; npx tsx scripts/smoke-test.ts https://paikhao.com 2>&1; } > out.txt || true
      - name: annotate
        if: always()
        run: |
          m=$(grep -v '^\s*$' out.txt | cut -c1-300 | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=out::$m"

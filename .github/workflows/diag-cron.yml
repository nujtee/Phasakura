name: diag cron (temporary, read-only)
on:
  push:
    branches: [diag/cron-tail]
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: secret NAMES only (never values)
        run: |
          for w in cherngdoi phatopview lungtaihomestay; do
            n=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$w/secrets" | jq -r '[.result[]?.name | select(test("ZOHO|RESEND"))] | join(",")')
            echo "$w: $n" >> out.txt
          done
      - name: annotate
        if: always()
        run: |
          m=$(cat out.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=out::$m"

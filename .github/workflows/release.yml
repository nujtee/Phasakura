name: Release
run-name: "Release ${{ inputs.sites }}${{ inputs.note && format(' — {0}', inputs.note) || '' }}"

# Center phase C1: the ONLY way code reaches the booking sites (Workers Builds is switched off for every site).
# Run it from GitHub → Actions → Release → Run workflow. Each site in turn: preflight → D1 Time Travel bookmark
# (restore point, shown in the run summary) → migrations → deploy → smoke test.
# Sites go in waves (sites/sites.json "wave"): wave 1 first (sites with the least traffic); a later wave starts
# only when every site of the earlier one succeeded. A failure stops the rest — sites already released stay on
# the new version (migrations are additive), roll one back with `npx wrangler rollback --config <its config>`.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token: "Edit Cloudflare Workers" template + Account › D1 › Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that holds every site
# Optional: GitHub environment "production-wave-2" / "production-wave-3" with a wait timer or required reviewer
# gives you time to watch wave 1 before the next wave starts.
# Center (phase C4): "all" also releases the Center console (center.phasakura.com); "center" releases only Center.
# It runs after wave 1 (Center keeps no guest data; a site never depends on it). After, not beside: Center has a
# service binding to every site's Worker, and a new site (Create site puts it in wave 1) has no Worker until its
# first wave-1 release — deploying Center before that fails with "Service binding … references Worker … not found".
# A wave-1 failure of an existing site does not hold Center back.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to release
        default: main
        required: true
      sites:
        description: '"all", or site slugs separated by spaces (e.g. "chomkhao cherngdoi"); "center" = the Center console'
        default: all
        required: true
      note:
        description: Optional — who / why (Center fills this in when it starts a release)
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
      wave3: ${{ steps.plan.outputs.wave3 }}
      center: ${{ steps.plan.outputs.center }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Credentials present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see the top of release.yml)"
            exit 1
          fi
      - id: plan
        env:
          SELECTION: ${{ inputs.sites }}
        run: npx tsx scripts/sites.ts plan "$SELECTION"
      - name: Summary
        env:
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "## Release $(git rev-parse --short HEAD) ($REF)"
            echo "- Wave 1: ${{ steps.plan.outputs.wave1 }}"
            echo "- Wave 2: ${{ steps.plan.outputs.wave2 }}"
            echo "- Wave 3: ${{ steps.plan.outputs.wave3 }}"
            echo "- Center: ${{ steps.plan.outputs.center }}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    # The same gate as CI: nothing reaches a site unless typecheck, lint, static checks and tests pass on this commit.
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npm run check

  center:
    needs: [plan, verify, wave1]
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && needs.plan.outputs.center == 'true'
    runs-on: ubuntu-latest
    environment: production
    name: center
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx tsx scripts/sites.ts run center release

  wave1:
    needs: [plan, verify]
    if: needs.plan.outputs.wave1 != '[]'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.wave1) }}
    name: wave 1 · ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npx tsx scripts/sites.ts run ${{ matrix.site }} release

  wave2:
    needs: [plan, verify, wave1]
    if: >-
      always() && needs.plan.result == 'success' && needs.verify.result == 'success'
      && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped')
      && needs.plan.outputs.wave2 != '[]'
    runs-on: ubuntu-latest
    environment: production-wave-2
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.wave2) }}
    name: wave 2 · ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npx tsx scripts/sites.ts run ${{ matrix.site }} release

  wave3:
    needs: [plan, verify, wave1, wave2]
    if: >-
      always() && needs.plan.result == 'success' && needs.verify.result == 'success'
      && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped')
      && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped')
      && needs.plan.outputs.wave3 != '[]'
    runs-on: ubuntu-latest
    environment: production-wave-3
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.wave3) }}
    name: wave 3 · ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npx tsx scripts/sites.ts run ${{ matrix.site }} release

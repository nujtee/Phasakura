name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Works before package-lock.json is committed, too.
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # The production build first: it is what Cloudflare Workers Builds runs on every push to main.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Lint report (every finding in one annotation)
        if: failure()
        run: |
          npx eslint . -f json -o eslint-report.json || true
          node -e "const r=require('./eslint-report.json');const all=r.flatMap(f=>f.messages.map(m=>({...m,file:f.filePath.replace(process.cwd()+'/','')})));const e=all.filter(m=>m.severity===2);console.log('::error title=eslint '+e.length+' errors, '+(all.length-e.length)+' warnings::'+e.map(m=>m.file+':'+m.line+' '+m.ruleId+' '+m.message.replace(/[\r\n%]/g,' ').slice(0,90)).join('%0A'))"
      - run: npm run check:static
      - name: Tests with coverage
        run: npm run test:coverage

  e2e:
    # Browser suites (Phases 9–14, 16 + responsive sweep) against a local HTTPS server with fake third-party APIs.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package*.json
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/.output
          retention-days: 7
